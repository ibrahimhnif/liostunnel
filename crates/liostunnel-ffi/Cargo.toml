[package]
name = "liostunnel_ffi"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[features]
# Forwarded so a build can drop DNS-over-HTTPS. `default` keeps the previous
# behaviour: the core's own `default = ["doh"]` was reaching this crate
# implicitly, and without this section `--no-default-features` here disabled
# nothing and exited 0.
default = ["doh"]
doh = ["liostunnel-core/doh"]

[dependencies]
liostunnel-core = { path = "../liostunnel-core", default-features = false }
flutter_rust_bridge = "=2.12.0"
serde.workspace = true
uuid.workspace = true
thiserror.workspace = true
serde_json.workspace = true

[dev-dependencies]
# Only the tests build `ss://` fixtures; the import itself decodes in the core,
# which owns the link format. Already in the lock file as a core dependency.
base64 = "0.22"
