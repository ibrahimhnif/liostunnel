[package]
name = "liostunnel-core"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
thiserror.workspace = true
tracing.workspace = true
async-trait.workspace = true
russh.workspace = true
tokio.workspace = true
tun-rs = { workspace = true }
smoltcp = { workspace = true }
tokio-util.workspace = true
polling.workspace = true
ipnet.workspace = true
libc.workspace = true
hyper = { workspace = true, optional = true }
hyper-util = { workspace = true, optional = true }
http-body-util = { workspace = true, optional = true }
bytes = { workspace = true, optional = true }
http = { workspace = true, optional = true }
tokio-rustls = { workspace = true, optional = true }
rustls = { workspace = true, optional = true }
webpki-roots = { workspace = true, optional = true }
shadowsocks = { version = "1.24", default-features = false, features = ["aead-cipher"] }
# `ss://` links are base64. Already in the lock file as a `shadowsocks`
# dependency, so this pulls in nothing new.
base64 = "0.22"

[features]
default = ["doh"]
doh = [
    "dep:hyper",
    "dep:hyper-util",
    "dep:http-body-util",
    "dep:bytes",
    "dep:http",
    "dep:tokio-rustls",
    "dep:rustls",
    "dep:webpki-roots",
]

[dev-dependencies]
# `test-util` is what makes `#[tokio::test(start_paused = true)]` available:
# the probe's timeout test would otherwise burn 8s of real wall clock, which
# was the whole module's runtime.
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "io-util", "time", "test-util"] }

# Android only. `jni` is how `LiosVpnService` reaches native code and how
# native code calls `VpnService.protect`; gating it by target keeps it out of
# every desktop build rather than carrying it everywhere for one platform.
[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
