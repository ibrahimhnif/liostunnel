name: Release main

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.93"
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,i686-linux-android
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: install the pinned NDK
        run: |
          set -u
          sdk="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          [ -n "$sdk" ] || { echo "no Android SDK on this runner" >&2; exit 1; }

          mgr="$(find "$sdk/cmdline-tools" -type f -name sdkmanager 2>/dev/null | head -1)"
          [ -x "$mgr" ] || { echo "no sdkmanager under $sdk/cmdline-tools" >&2; exit 1; }

          yes | "$mgr" --licenses > /dev/null 2>&1 || true
          "$mgr" --install "ndk;27.1.12297006"

          ndk="$sdk/ndk/27.1.12297006"
          [ -d "$ndk" ] || { echo "NDK still absent at $ndk after install" >&2; exit 1; }

          echo "ANDROID_NDK_HOME=$ndk" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ndk" >> "$GITHUB_ENV"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: flutter pub get
        run: flutter pub get
        working-directory: app
      - name: build split APKs
        run: flutter build apk --release --split-per-abi
        working-directory: app
      - name: build universal APK
        run: flutter build apk --release --target-platform android-arm,android-arm64,android-x64
        working-directory: app
      - uses: actions/upload-artifact@v4
        with:
          name: release-android
          path: app/build/app/outputs/flutter-apk/*release*.apk

  build-desktop:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.93"
      - uses: Swatinem/rust-cache@v2
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build libgtk-3-dev libfuse2
      - name: build the helper
        run: cargo build --release -p liostunnel-helper
      - name: flutter pub get
        run: flutter pub get
        working-directory: app
      - name: build the app
        run: flutter build ${{ runner.os == 'macOS' && 'macos' || 'linux' }} --release
        working-directory: app
      - name: build the macOS package
        if: runner.os == 'macOS'
        run: ./packaging/make-pkg.sh
      - name: build the AppImage
        if: runner.os == 'Linux'
        run: ./packaging/make-appimage.sh
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ runner.os }}
          path: |
            dist/*.pkg
            dist/*.AppImage

  publish-release:
    runs-on: ubuntu-latest
    needs:
      - build-android
      - build-desktop
    steps:
      - uses: actions/download-artifact@v4.1.3
        with:
          path: release-files
          merge-multiple: true
      - name: build release notes with OS file list
        run: |
          {
            echo "## Release files"
            echo
            echo "### Linux"
            find release-files -type f -name '*.AppImage' -printf -- '- %f\n' | sort || true
            echo
            echo "### macOS"
            find release-files -type f -name '*.pkg' -printf -- '- %f\n' | sort || true
            echo
            echo "### Android"
            find release-files -type f -name '*.apk' -printf -- '- %f\n' | sort || true
          } > release-notes.md
      - name: create or update release
        uses: ncipollo/release-action@v1
        with:
          tag: main-${{ github.sha }}
          name: Main build ${{ github.sha }}
          bodyFile: release-notes.md
          artifacts: "release-files/*.AppImage,release-files/*.pkg,release-files/*.apk"
          artifactErrorsFailBuild: true
          allowUpdates: true
          removeArtifacts: true
          prerelease: true
