name: CI

# Spec §12's test layers, mapped to jobs:
#   T1-T3 (config/packet-engine/DNS unit tests, no privilege, no network) -> `unit`
#   T4 (real sshd in Docker, no TUN, no root)                             -> `integration`
#   the ignored DoH network test (needs outbound internet, not privilege) -> `doh-network`
#   T5 (real TUN device, root)                                           -> `tun-e2e`
# T6 (the DNS leak test) and the throughput/idle-CPU gates are release
# gates for a human to run on real hardware against a real server —
# `testing/gates/README.md` — not something this workflow runs, ever.

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # The Flutter half. It ran nowhere until an independent review pointed out
  # that "the suite is green" had only ever been a claim about the Rust side —
  # which is how four Dart tests that pass against the implementations they
  # name survived being written.
  #
  # Both platforms, because the app links the Rust statically through cargokit
  # on macOS and through CMake on Linux, and those are different build paths.
  flutter:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.93"
      - uses: Swatinem/rust-cache@v2
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      # `flutter test` runs on the plain Dart VM with no Xcode or CMake build
      # behind it, so it opens the library by path rather than linking it.
      - name: stage the FFI library for the test loader
        run: ./testing/build-ffi-for-tests.sh
      - name: flutter pub get
        run: flutter pub get
        working-directory: app
      - name: flutter analyze
        run: flutter analyze
        working-directory: app
      - name: flutter test
        run: flutter test
        working-directory: app

  # Everything that needs neither root nor a TUN device nor a network peer.
  # Runs on every push/PR, on both target platforms (spec §12: D2 forces
  # macOS utun and Linux TUN to diverge as little as possible, so CI covers
  # both from the first commit rather than discovering a gap in Phase 1).
  unit:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.93"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      - name: cargo fmt --check
        run: cargo fmt --all --check

      - name: cargo clippy -D warnings
        run: cargo clippy --all-targets --workspace -- -D warnings

      # The hermetic tests: no root, no TUN, no routing table, no
      # network, and no test may touch a real ~/.liostunnel — see the
      # project's test-hygiene rule in README.md.
      - name: cargo test --workspace
        run: cargo test --workspace

      # The lean build (DoH's hyper/rustls/tokio-rustls/webpki-roots stack is
      # feature-gated behind `doh`, default-on) must keep compiling with it
      # off — this is the PRD §8 mobile-binary-size lean path.
      - name: lean build (--no-default-features)
        run: cargo build -p liostunnel-core --no-default-features

      # Task 1's 24 assertions on install-helper.sh's authorization boundary --
      # which uid the helper is installed to serve, and the refusals that keep
      # it from serving root or a system account. It is hermetic (stubs every
      # privileged command and redirects the unit-file write) and covers both
      # the Darwin and Linux branches from either host, so it runs here rather
      # than gated to one OS in the matrix.
      - name: install-script guards
        run: ./testing/verify-install-script.sh

  # T4: a real sshd + target HTTP server in Docker. No TUN, no privileges —
  # only Docker, which the runner already has.
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.93"
      - uses: Swatinem/rust-cache@v2
      - run: make -C testing/docker up
      - run: cargo test -p liostunnel-core --test ssh_integration -- --ignored
      # The five tests that are the only evidence for P1b-1, P1b-2 and P1b-3.
      # Before this they ran nowhere but one developer's machine, once. Both
      # suites are hermetic: the fixture carries its own resolver, so neither
      # needs outbound internet from the runner.
      - run: cargo test -p liostunnel-core --test shadowsocks_integration -- --ignored
      - if: always()
        run: make -C testing/docker down

  # The one ignored test that needs outbound internet (a real DoH round trip
  # to 1.1.1.1:443) but no privilege. GitHub-hosted runners generally have
  # outbound internet access, so this is run rather than skipped — but it
  # depends on a third party's service being reachable from the runner at
  # the moment CI executes, which nothing in this repo controls, so a
  # failure here does not block the job or the PR.
  doh-network:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.93"
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p liostunnel-core --lib dns::over_https -- --ignored --nocapture

  # T5 (EC7's Linux half): the real device. GitHub's ubuntu-latest runners
  # are full VMs with genuine root (via sudo) and a real kernel, so this is
  # something CI can actually exercise — unlike a sandboxed dev session,
  # which must not create a TUN device or touch routing at all (see
  # testing/gates/README.md and the Task 22 report for that line). macOS's
  # utun half of EC7 is verified locally, per crates/liostunnel-core/tests/
  # tun_e2e.rs's own doc comment, not in CI, since GitHub's hosted macOS
  # runners do not reliably support NET_ADMIN-equivalent TUN creation.
  tun-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.93"
      - uses: Swatinem/rust-cache@v2
      - name: preflight — /dev/net/tun must exist
        run: |
          sudo modprobe tun || true
          test -c /dev/net/tun || { echo "::error::/dev/net/tun is missing on this runner"; exit 1; }
      - run: cargo build -p liostunnel-core --tests
      - name: run TUN e2e tests as root
        run: sudo -E env "PATH=$PATH" cargo test -p liostunnel-core --test tun_e2e -- --ignored

  # The first thing in this workflow that runs `flutter build`. `flutter test`
  # exercises none of cargokit, CMake, the Xcode project or the podspec, so a
  # change that broke the macOS bundle passed every other check here.
  package:
    runs-on: ${{ matrix.os }}
    strategy:
      # A macOS failure should still produce the Linux artifact: the two share
      # nothing but install-helper.sh.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.93"
      - uses: Swatinem/rust-cache@v2
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      # `flutter build linux` needs these, and without them it fails with a
      # CMake error that reads like a Flutter bug rather than a missing
      # package. libfuse2 is for appimagetool.
      - name: linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build libgtk-3-dev libfuse2
      - name: build the helper
        run: cargo build --release -p liostunnel-helper
      - name: flutter pub get
        run: flutter pub get
        working-directory: app
      # cargokit compiles the FFI crate during this, which is why the Rust
      # toolchain is installed above rather than only for the step before.
      - name: build the app
        run: flutter build ${{ runner.os == 'macOS' && 'macos' || 'linux' }} --release
        working-directory: app
      - name: build the macOS package
        if: runner.os == 'macOS'
        run: ./packaging/make-pkg.sh
      - name: verify the macOS package
        if: runner.os == 'macOS'
        run: ./testing/verify-pkg.sh dist/*.pkg
      - name: build the AppImage
        if: runner.os == 'Linux'
        run: ./packaging/make-appimage.sh
      - name: verify the AppImage
        if: runner.os == 'Linux'
        run: ./testing/verify-appimage.sh dist/*.AppImage
      - uses: actions/upload-artifact@v4
        with:
          name: liostunnel-${{ runner.os }}-${{ github.sha }}
          path: |
            dist/*.pkg
            dist/*.AppImage
